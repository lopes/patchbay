[project]
name = "patchbay"
version = "0.1.0"
description = "A personal Spotify library and playlist manager, exposed to Claude Desktop over MCP."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp>=1.2.0",
]

[project.scripts]
patchbay = "patchbay.server:main"          # the MCP server (what Claude Desktop launches)
patchbay-auth = "patchbay.auth:main"       # one-time browser authorization
patchbay-check = "patchbay.check:main"     # read-only smoke check against the live API

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patchbay"]
